<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<style>
:root{--bg:#0F1A2B;--panel:#15223A;--panel2:#1C2C48;--ink:#EAF0FA;--ink-dim:#93A2C2;--line:#263656;--accent:#2FD9B8;--accent-ink:#06261F;--warn:#FF7A59;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 50px;}
h1{font-size:18px;margin:0 0 18px;}
.login-box{max-width:320px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;}
.login-box input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font-size:13.5px;margin-bottom:12px;}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);}
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--ink-dim);font-size:13px;cursor:pointer;}
.tab.active{border-color:var(--accent);color:var(--accent);}
.order{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;}
.order .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order b{font-size:14px;}
.order .ref{color:var(--ink-dim);font-size:11.5px;}
.order .row{font-size:12.5px;color:var(--ink-dim);margin:3px 0;}
.badge{font-size:11px;padding:3px 9px;border-radius:12px;font-weight:600;}
.badge.pending{background:rgba(255,200,87,.15);color:#FFC857;}
.badge.approved{background:rgba(47,217,184,.15);color:var(--accent);}
.badge.rejected{background:rgba(255,122,89,.15);color:var(--warn);}
.actions{display:flex;gap:8px;margin-top:10px;}
.actions button{flex:1;padding:8px;border-radius:8px;border:none;font-size:12.5px;font-weight:600;cursor:pointer;}
.approve-btn{background:var(--accent);color:var(--accent-ink);}
.reject-btn{background:transparent;border:1px solid var(--warn) !important;color:var(--warn);}
.ss-link{color:var(--accent);font-size:12px;}
.empty{text-align:center;color:var(--ink-dim);padding:30px;font-size:13px;}
.logout{background:none;border:none;color:var(--ink-dim);font-size:12px;cursor:pointer;text-decoration:underline;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
</style>
</head>
<body>
<div id="loginView" class="login-box">
  <h1 style="text-align:center">Admin Login</h1>
  <input id="pwInput" type="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
  <div id="loginErr" style="color:var(--warn);font-size:12px;margin-top:8px;"></div>
</div>

<div id="panelView" class="wrap" style="display:none">
  <div class="topbar">
    <h1>Payment Requests</h1>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-f="all" onclick="setFilter('all')">Sab</div>
    <div class="tab" data-f="pending" onclick="setFilter('pending')">Pending</div>
    <div class="tab" data-f="approved" onclick="setFilter('approved')">Approved</div>
    <div class="tab" data-f="rejected" onclick="setFilter('rejected')">Rejected</div>
  </div>
  <div id="list"></div>
</div>

<script>
let filter = 'all';

async function checkSession(){
  const r = await fetch('/api/admin/session');
  const d = await r.json();
  if(d.isAdmin){ showPanel(); } else { document.getElementById('loginView').style.display = 'block'; }
}

async function login(){
  const password = document.getElementById('pwInput').value;
  const r = await fetch('/api/admin/login', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password})
  });
  if(r.ok){ showPanel(); } else {
    document.getElementById('loginErr').textContent = 'Galat password';
  }
}

async function logout(){
  await fetch('/api/admin/logout', {method:'POST'});
  document.getElementById('panelView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}

function showPanel(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('panelView').style.display = 'block';
  loadOrders();
}

function setFilter(f){
  filter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.f === f));
  loadOrders();
}

async function loadOrders(){
  const q = filter === 'all' ? '' : '?status=' + filter;
  const r = await fetch('/api/admin/orders' + q);
  const orders = await r.json();
  const list = document.getElementById('list');
  if(!orders.length){ list.innerHTML = '<div class="empty">Koi order nahi mila</div>'; return; }
  list.innerHTML = orders.map(o => `
    <div class="order">
      <div class="top">
        <div><b>${esc(o.customer_name)}</b><div class="ref">${o.order_ref} · ${o.created_at}</div></div>
        <span class="badge ${o.status}">${o.status}</span>
      </div>
      <div class="row">Phone: ${esc(o.phone)}</div>
      <div class="row">Method: ${esc(o.method)} · TID: ${esc(o.transaction_id)}</div>
      ${o.amount ? `<div class="row">Amount: Rs ${o.amount}</div>` : ''}
      ${o.screenshot_path ? `<a class="ss-link" href="${o.screenshot_path}" target="_blank">Screenshot dekhein</a>` : ''}
      ${o.status === 'pending' ? `
        <div class="actions">
          <button class="approve-btn" onclick="act(${o.id},'approve')">Approve</button>
          <button class="reject-btn" onclick="act(${o.id},'reject')">Reject</button>
        </div>` : ''}
    </div>
  `).join('');
}

async function act(id, action){
  await fetch(`/api/admin/orders/${id}/${action}`, {method:'POST'});
  loadOrders();
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

checkSession();
</script>
</body>
</html>
